<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10-Second Challenge</title>
<link rel="stylesheet" href="10secchallenge_style.css">
</head>
<body>
<div id="startScreen" class="screen">
  <main class="card start-card">
    <div class="bolt">⚡</div>
    <h1>10-SECOND<br>CHALLENGE</h1>
    <p class="tagline">Think Fast. Answer Faster!</p>
    <h2>CHOOSE YOUR LEVEL</h2>
    <div class="level-buttons">
      <button class="level-btn beginner" data-level="beginner">
        <span>🌱</span><strong>BEGINNER</strong><small>Primary Level</small>
      </button>
      <button class="level-btn intermediate" data-level="intermediate">
        <span>🚀</span><strong>INTERMEDIATE</strong><small>Upper Primary</small>
      </button>
    </div>
  </main>
</div>

<div id="timeScreen" class="screen hidden">
  <main class="card start-card">
    <div class="bolt">⏱️</div>
    <h1>CHOOSE<br>YOUR TIME</h1>
    <p id="levelLabel" class="tagline">Beginner</p>
    <div class="time-buttons">
      <button class="time-btn ten" data-time="10"><span>10</span>SECONDS</button>
      <button class="time-btn fifteen" data-time="15"><span>15</span>SECONDS</button>
      <button class="time-btn twenty" data-time="20"><span>20</span>SECONDS</button>
    </div>
    <button id="backToLevels" class="secondary-btn">← BACK</button>
  </main>
</div>

<div id="gameScreen" class="screen hidden">
  <main class="game-container">
    <header class="top-bar">
      <div class="game-title">⚡ 10-SECOND CHALLENGE</div>
      <div class="level-pill" id="gameLevel">BEGINNER</div>
      <button id="homeButton" class="home-btn">⌂ HOME</button>
    </header>
    <section class="timer-container">
      <div id="timer" class="timer">10</div>
    </section>
    <section class="question-card">
      <div class="question-label">YOUR CHALLENGE</div>
      <div id="question" class="question">Get ready!</div>
    </section>
    <div id="timeUp" class="time-up hidden">⏰ TIME'S UP!</div>
    <button id="nextButton" class="next-btn">NEXT CHALLENGE →</button>
  </main>
</div>

<div id="errorScreen" class="screen hidden">
  <main class="card start-card">
    <div class="bolt">⚠️</div>
    <h1>QUESTIONS NOT FOUND</h1>
    <p>Please make sure <strong>beginner.tsv</strong> and <strong>intermediate.tsv</strong> are in the same folder as the game.</p>
    <button onclick="location.reload()" class="secondary-btn">TRY AGAIN</button>
  </main>
</div>

<script>
let questions = { beginner: [], intermediate: [] };
let pools = { beginner: [], intermediate: [] };
let selectedLevel = "beginner";
let selectedTime = 10;
let timeRemaining = 10;
let timerInterval = null;

const $ = id => document.getElementById(id);
const startScreen = $("startScreen");
const timeScreen = $("timeScreen");
const gameScreen = $("gameScreen");
const errorScreen = $("errorScreen");
const timerEl = $("timer");
const questionEl = $("question");
const timeUpEl = $("timeUp");
const nextBtn = $("nextButton");

async function loadTSV(file) {
  const response = await fetch(file);
  if (!response.ok) throw new Error(file + " could not be loaded");
  const text = await response.text();
  return text.split(/\r?\n/)
    .map(x => x.trim())
    .filter(Boolean)
    .filter((x, i) => !(i === 0 && x.toLowerCase() === "question"))
    .map(x => x.split("\t")[0].trim())
    .filter(Boolean);
}

async function loadQuestions() {
  try {
    questions.beginner = await loadTSV("10sec_beginner.tsv");
    questions.intermediate = await loadTSV("10sec_intermediate.tsv");
    pools.beginner = shuffle(questions.beginner);
    pools.intermediate = shuffle(questions.intermediate);
    if (questions.beginner.length < 500 || questions.intermediate.length < 500) {
      console.warn("Question banks contain fewer than 500 questions.");
    }
  } catch (e) {
    console.error(e);
    startScreen.classList.add("hidden");
    timeScreen.classList.add("hidden");
    errorScreen.classList.remove("hidden");
  }
}

function shuffle(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function nextQuestion() {
  if (pools[selectedLevel].length === 0) {
    pools[selectedLevel] = shuffle(questions[selectedLevel]);
  }
  return pools[selectedLevel].pop();
}

function showScreen(screen) {
  [startScreen, timeScreen, gameScreen, errorScreen].forEach(s => s.classList.add("hidden"));
  screen.classList.remove("hidden");
}

document.querySelectorAll(".level-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedLevel = btn.dataset.level;
    $("levelLabel").textContent =
      selectedLevel === "beginner" ? "Beginner • Primary Level" : "Intermediate • Upper Primary";
    showScreen(timeScreen);
  });
});

document.querySelectorAll(".time-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedTime = Number(btn.dataset.time);
    $("gameLevel").textContent = selectedLevel.toUpperCase();
    showScreen(gameScreen);
    loadNextChallenge();
  });
});

$("backToLevels").addEventListener("click", () => showScreen(startScreen));

$("homeButton").addEventListener("click", () => {
  stopTimer();
  showScreen(startScreen);
});

nextBtn.addEventListener("click", loadNextChallenge);

function loadNextChallenge() {
  stopTimer();
  questionEl.textContent = nextQuestion();
  timeUpEl.classList.add("hidden");
  timerEl.classList.remove("warning", "danger");
  nextBtn.disabled = false;
  timeRemaining = selectedTime;
  updateTimer();
  setTimeout(startTimer, 350);
}

function startTimer() {
  stopTimer();
  timerInterval = setInterval(() => {
    timeRemaining--;
    updateTimer();

    if (timeRemaining <= 5) timerEl.classList.add("warning");
    if (timeRemaining <= 3) timerEl.classList.add("danger");

    if (timeRemaining <= 0) timeIsUp();
  }, 1000);
}

function updateTimer() {
  timerEl.textContent = timeRemaining;
}

function timeIsUp() {
  stopTimer();
  timeRemaining = 0;
  updateTimer();
  timeUpEl.classList.remove("hidden");
}

function stopTimer() {
  if (timerInterval !== null) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

loadQuestions();
</script>
</body>
</html>
